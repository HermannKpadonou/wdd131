<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/lazyload.css">
    <title>lazyloading</title>
</head>
<body>
    <header>
        <h1>Lazy Loading Images</h1>
    </header>
    <main>
        <picture>
            <img src="images/elephant12.webp" alt="1" loading="lazy"  width="400" height="600">
        </picture>
        <picture>
            <img src="images/flag.jpg" alt="2" loading="lazy"  width="400" height="600">
        </picture>
        <picture>
            <img src="images/india-republic-day-celebration-with-3d-flag.jpg" alt="3" loading="lazy"  width="400" height="600">
        </picture>  
        <picture>
            <img src="images/masque ivoirien.jpg" alt="4" loading="lazy"  width="400" height="600">
        </picture>
        <picture>
            <img src="images/OIP.jpg" alt="5" loading="lazy" width="400" height="600">
        </picture>
        <picture>
            <img src="images/people.jpg" alt="6" loading="lazy" width="400" height="600">
        </picture>
    </main>
</body>
</html>
